services:
  postgres:
    image: postgres:16-alpine
    container_name: veille_prix_postgres
    environment:
      POSTGRES_DB: veille_prix_agricoles
      POSTGRES_USER: veille_user
      POSTGRES_PASSWORD: veille_dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/postgres_data

  mongo:
    image: mongo:8.0
    container_name: veille_prix_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: veille_user
      MONGO_INITDB_ROOT_PASSWORD: veille_dev_password
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
    